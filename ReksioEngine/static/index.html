<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Reksio Engine</title>

        <style>
            html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
            #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
            #game canvas { display: block; width: min(100vw, 133.333333vh); height: auto; }
            #controls { display: none; }
            .notready {
                width: 100%;
                height: 100%;
                background-color: #000;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
            }

            .notready:before {
                content: 'Press here to start';
                font-family: sans-serif;
                font-size: 24px;
            }

            #game:fullscreen {
                display: flex;
                justify-content: center;
            }
        </style>
    </head>
    <body>
        <div id="game"></div>
        <div id="controls">
            <button id="enterFullscreen">Fullscreen</button>
        </div>
        <div id="debug"></div>
    </body>
</html>
